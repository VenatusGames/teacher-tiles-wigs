name: Deploy WIGs to GitHub Pages

run-name: Deploy WIGs from main (triggered by ${{ github.ref_name }})

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: |
          npm install --global pnpm@11.19.0
          pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Prepare site
        run: |
          set -e
          mkdir _site
          cp -R dist/. _site/
          cp CNAME _site/CNAME

          echo "Publishing commit: ${GITHUB_SHA} -> https://wigs.teachertiles.com/"
          {
            echo '### Deployment source'
            echo "- Branch: \`${GITHUB_REF_NAME}\`"
            echo "- Commit: \`${GITHUB_SHA:0:12}\`"
            echo "- Site: [wigs.teachertiles.com](https://wigs.teachertiles.com/)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Generate asset timestamp
        run: |
          asset_version=$(date -u +%s%3N)
          echo "ASSET_VERSION=${asset_version}" >> "$GITHUB_ENV"

      - name: Cache-bust local assets
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import re

          index = Path('_site/index.html')
          if not index.is_file():
              raise SystemExit('Missing required site entry point: _site/index.html')

          version = os.environ['ASSET_VERSION']
          asset_pattern = r'(?P<prefix>(?:href|src)=["\'])(?P<asset>(?![a-zA-Z][a-zA-Z0-9+.-]*:)(?!//)[^"\'?]+\.(?:js|css))(?:\?[^"\']*)?(?P<suffix>["\'])'
          html = index.read_text(encoding='utf-8')
          local_assets = list(re.finditer(asset_pattern, html))
          if not local_assets:
              raise SystemExit('No local JavaScript or CSS assets found in _site/index.html')

          site_root = Path('_site').resolve()
          for match in local_assets:
              asset_path = match.group('asset')
              asset = ((Path('_site') / asset_path.lstrip('/')) if asset_path.startswith('/') else (index.parent / asset_path)).resolve()
              if not asset.is_relative_to(site_root):
                  raise SystemExit('Asset path escapes the public site directory')
              if not asset.is_file():
                  raise SystemExit(f'Missing local asset referenced by index: {asset_path}')

          html, replacements = re.subn(
              asset_pattern,
              lambda match: f"{match.group('prefix')}{match.group('asset')}?v={version}{match.group('suffix')}",
              html,
          )
          if replacements != len(local_assets):
              raise SystemExit(f'Expected {len(local_assets)} local asset replacements, found {replacements}')
          index.write_text(html, encoding='utf-8')
          print(f'Cache-busting completed successfully for {replacements} local assets.')
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Report deployment result
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          echo "GitHub Pages deployment completed successfully."
          echo "Published WIGs: https://wigs.teachertiles.com/"
          echo "Pages deployment URL: ${PAGE_URL}"
          {
            echo '### Deployment result'
            echo 'Deployment completed successfully.'
            echo '- WIGs: [https://wigs.teachertiles.com/](https://wigs.teachertiles.com/)'
            echo "- Pages deployment URL: ${PAGE_URL}"
          } >> "$GITHUB_STEP_SUMMARY"
